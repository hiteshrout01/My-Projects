<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2nd HTML&CSS</title>
    <link rel="stylesheet" href="hello.css">
</head>
<body>
    <a href="hello.html">MOVE TO MAIN</a>
    <img 
        src="./photos/photo-800.jpeg" 
        srcset="./photos/photo-400.jpeg 400w,
        ./photos/photo-800.jpeg 800w,
        ./photos/photo-1200.jpeg 1200w"
        sizes="(max-width: 600px) 100vw, 800px"
        alt="Dino"

    >
    <picture>
        <source 
        media="(max-width:600px)" 
        srcset="./photos/photo-400.jpeg">

        <img 
            src="./photos/photo-1200.jpeg" 
            alt="dino responsive img">

    </picture>
    <br>
    <img 
        src="./photos/mountain-landscape.jpeg" 
        loading="lazy" 
        alt="lazy loading img"
        width="500"
        height="250">
    <br>
    <button>Test Button</button>
    <br>
    <form>
        <label>Name:</label>
        <input type="text">
        <br>
        <label>Number:</label>
        <input type="number">
        <br>
        <label>Password:</label>
        <input type="password">
        <br>
        <input type="submit">
    </form>
</body>
</html>
